<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ticketing</title>
    <style>
        body{
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }
        #contedor{
            display: grid;
            align-items: center;
            border: 1px solid black;
            border-radius: 10px;
            width: 400px;
            padding: 10px;
        }
        #Mostrador{
            text-align: left;
            padding: 0;
        }
        #Creator{
            display: grid;
            align-items: center;
            border: 1px solid black;
            border-radius: 10px;
            width: 200px;
            padding: 5px;
        }
        #save{
            padding-top: 10px;
        }
    </style>
</head>
<body>
    <div id="contedor">
        <div id="Mostrador">
            <h3>Tickets anteriors</h3>
        </div>
        <h3 id="ticket-num">Tickets 1</h3>
        <div id="Creator">
            <label for="Concepto">Concepto</label>
            <input type="text" id="Concepto">
            <label for="precio">precio</label>
            <input type="number" id="precio">
        </div>
        <div id="save">
            <button onclick="guardar()">GUARDAR</button>
        </div>
    </div>
    <script src="JS/script.js"></script>
</body>
</html>
