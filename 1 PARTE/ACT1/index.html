<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login CV</title>
    <link rel="stylesheet" href="style.css">
    <script src="JS/script.js"></script>
</head>
<body>
    <div id="centrar">
        <div id="Login">
            <h2>Login CV</h2>
            <label>Usuario</label>
            <input type="text" id="usuario">
            <label>password</label>
            <input type="text" id="pass">
            <button onclick="login()">Validar</button>
        </div>
    </div>
    <div id="rellenar" style="display: none;">
        <h2>Mi Curriculum</h2>
        <div id="personal">
            <fieldset>
                <legend>Personal</legend>
                <label>Nombre</label>
                <input type="text" id="nombref" required>
                <br>
                <label>Apellidos</label>
                <input type="text" id="apellidosf" required>
                <br>
                <label>Edad</label>
                <input type="number" id="edadf" required>
                <br>
                <label >Telefono</label>
                <input type="number" id="numerof" required>
                <br>
                <label>Pais</label>
                <input type="text" id="paisf" required>
                <label>Foto</label>
                <input type="url" id="fotof" placeholder="URL">
            </fieldset>
        </div>
        <div id="estudios">
            <fieldset>
                <legend>Estudios</legend>
                <label>Cursos</label>
                <br>
                <input type="text" id="cursosf" required>
                <br>
                <label>Centro</label>
                <br>
                <input type="text" id="centrof" required>
                <div id="mostrar">
                    <p>Lista de Estudios</p>
                </div>
                <br>
                <button onclick="estudios_guardar()">Guardar</button>
            </fieldset>
        </div>
        <div id="idiomas">
            <fieldset>
                <legend>Idiomas</legend>
                <label>Idioma</label>
                <br>
                <input type="text" id="idomaf" required>
                <br>
                <label>Nivel</label>
                <br>
                <input type="radio" name="nivel" id="alto" value="Alto">
                <label for="alto">Alto</label>
                <input type="radio" name="nivel" id="medio" value="Medio">
                <label for="medio">Medio</label>
                <input type="radio" name="nivel" id="bajo" value="Bajo">
                <label for="bajo">Bajo</label>
                <br>
                <div id="mostrar1">
                    <p>Lista de Idiomas</p>
                </div>
                <button onclick="idiomas_guardar()">Guardar</button>
            </fieldset>
        </div>
        <button type="button" onclick="finalizarCV()">Finalizar CV</button>
    </div>
<div id="crerf" style="display: none;">
        <h1>Curriculum vitae</h1>
        <div id="fotoCV">
            <div id="fotoC">
            </div>
            <div id="datosCV">
                <h2>Datos personales</h2>
                <div id="datosC"></div>
            </div>
        </div>
        <div class="estudiosCV">
            <h2>Estudios</h2>
            <div id="estudiosC"></div>
        </div>
        <div class="idiomasCV">
            <h2>Idiomas</h2>
            <div id="idiomasC"></div>
        </div>
    </div>
</body>
</html>
